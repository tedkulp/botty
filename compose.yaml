services:
  botty:
    # BOTTY_IMAGE overrides the image, e.g. a locally built tag.
    image: ${BOTTY_IMAGE:-ghcr.io/tedkulp/botty:main}
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      # Must be writable by uid 1000 (the image's `node` user): mkdir data && sudo chown 1000:1000 data
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      # No curl in the slim image; Node has fetch built in.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
